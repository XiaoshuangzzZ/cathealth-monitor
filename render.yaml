services:
  - type: web
    name: cathealth-backend
    runtime: python
    plan: free
    rootDir: backend/flask
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: /opt/render/project/src
    disk:
      name: cathealth-data
      mountPath: /data
      sizeGB: 1
